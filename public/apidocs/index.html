<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Convex API Docs</title>
<link rel="canonical" href="https://javadoc.io/doc/world.convex/convex-core/latest/">
<meta http-equiv="refresh" content="0; url=https://javadoc.io/doc/world.convex/convex-core/latest/">
<script>
// Preserve deep-link path, query, and hash on redirect.
(function () {
  var rawPath = window.location.pathname;
  var suffix = rawPath.replace(/^\/+apidocs\/?/i, "");
  var target =
    "https://javadoc.io/doc/world.convex/convex-core/latest/" +
    suffix +
    window.location.search +
    window.location.hash;
  window.location.replace(target);
})();
</script>
<meta name="robots" content="noindex">
</head>
<body>
<p>The Convex API documentation (Javadoc) has moved to
<a href="https://javadoc.io/doc/world.convex/convex-core/latest/">javadoc.io</a>.</p>
</body>
